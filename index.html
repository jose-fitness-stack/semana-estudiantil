<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Entrenamiento - CD Estudiantil</title>

<style>
:root{
--bg:#0f172a;
--card:#1e293b;
--card-soft:#273449;
--text:#f1f5f9;
--sub:#94a3b8;
--accent1:#22c55e;
--accent2:#3b82f6;
--accent3:#f59e0b;
--border:#334155;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui;}
body{background:var(--bg);color:var(--text);padding:30px;}

header{text-align:center;margin-bottom:30px;}
header h1{font-size:28px;margin-bottom:5px;}
header p{color:var(--sub);}

.week-selector{
text-align:center;
margin-bottom:20px;
}

.week-selector button{
padding:8px 16px;
margin:5px;
border:none;
border-radius:8px;
cursor:pointer;
background:var(--card-soft);
color:var(--text);
}

.week-selector button.active{
background:var(--accent1);
color:#000;
font-weight:bold;
}

.info-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-bottom:30px;
}

.info-card{
background:var(--card);
padding:15px;
border-radius:12px;
border:1px solid var(--border);
}

.tabs{display:flex;gap:10px;margin-bottom:25px;flex-wrap:wrap;}
.tab{padding:10px 18px;border-radius:8px;border:none;cursor:pointer;background:var(--card-soft);color:var(--text);}
.tab.active{background:var(--accent2);}

.day{display:none;}
.day.active{display:block;}

.day-card{
background:var(--card);
padding:25px;
border-radius:16px;
margin-bottom:25px;
border:1px solid var(--border);
}

.day-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
flex-wrap:wrap;
}

.block{margin-bottom:20px;padding:15px;background:var(--card-soft);border-radius:12px;}
.block h3{margin-bottom:10px;color:var(--accent2);}
.task{padding:6px 0;border-bottom:1px solid var(--border);font-size:14px;}

.checklist{
margin-top:20px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:10px;
}

.player{
background:var(--card-soft);
padding:10px;
border-radius:8px;
font-size:13px;
display:flex;
align-items:center;
gap:10px;
}

.progress-container{margin:20px 0;}
.progress-label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;}

.progress-bar{
height:12px;
background:var(--card-soft);
border-radius:20px;
overflow:hidden;
}

.progress{
height:100%;
background:var(--accent1);
width:0%;
transition:.4s;
}

.export-btn{
margin-top:15px;
padding:8px 14px;
border:none;
border-radius:8px;
background:var(--accent3);
cursor:pointer;
font-weight:bold;
}

.summary{
background:var(--card);
padding:20px;
border-radius:16px;
border:1px solid var(--border);
margin-top:20px;
}
</style>
</head>

<body>

<header>
<h1>⚽ CD Estudiantil</h1>
<p>Sub 14 (2012) · DT: Jose Antonio Mazo</p>
</header>

<div class="week-selector">
<button class="active" onclick="changeWeek(3,this)">Semana 3</button>
<button onclick="changeWeek(4,this)">Semana 4</button>
</div>

<div class="tabs">
<button class="tab active" onclick="showDay('lunes',this)">Lunes</button>
<button class="tab" onclick="showDay('martes',this)">Martes</button>
<button class="tab" onclick="showDay('jueves',this)">Jueves</button>
</div>

<div id="content"></div>

<script>

let currentWeek = 3;

const playerList = [
"Juan José Gálvez Rodríguez","Luis Angel Quintero Torres","Nicolás Cadena Molina",
"Tomás Ruiz Osorio","Juan José Ortiz","Nicolas Tamayo Olano",
"Roger Andrés","Jeronimo Blandón Bedoya","Juan Pablo Jaramillo Jaramillo",
"Miguel Ángel Ruiz Villegas","Isaac Manuel Ramírez Bolaño",
"Luis Said Andrade Hinestroza","Juan Miguel Ospina Villa",
"Alexis Posada Zabala","Dylan Esteban Tovar Montenegro",
"Emanuel Aristizabal","Matías Díaz David","Kevin Vanegas Cano"
];

const plans = {

3:{
lunes:{
inicial:["10' Movilidad articular + desplazamiento","10' Secuencia pases + tercer hombre","10' Rondo 4v1 / 5v2"],
central:["20' Posesión 6v6+8","20' Juego condicionado 10v10 (3 carriles)"],
final:["20' Trabajo aeróbico intermitente"]
},
martes:{
inicial:["10' Activación cognitiva","10' Preventivos"],
central:["20' Circuito fuerza","15' Rechazos orientados","15' Conservación con comodines"],
final:["20' Pases con finalización"]
},
jueves:{
inicial:["10' Movilidad + desplazamiento","10' Aceleraciones","10' Técnica de carrera"],
central:["20' Duelos 1v1 - 2v2","40' Fútbol alta intensidad"],
final:["10' Estiramientos"]
}
},

4:{
lunes:{
inicial:["Agregar nueva tarea inicial"],
central:["Agregar tarea central"],
final:["Agregar tarea final"]
},
martes:{
inicial:["Editar aquí semana 4"],
central:["Editar aquí semana 4"],
final:["Editar aquí semana 4"]
},
jueves:{
inicial:["Editar aquí semana 4"],
central:["Editar aquí semana 4"],
final:["Editar aquí semana 4"]
}
}

};

function renderWeek(){
const container=document.getElementById("content");
container.innerHTML="";

["lunes","martes","jueves"].forEach(day=>{

let dayData = plans[currentWeek][day];

let html=`
<div class="day ${day==='lunes'?'active':''}" id="${day}">
<div class="day-card">
<div class="day-header">
<h2>${day.toUpperCase()}</h2>
<span>Semana ${currentWeek}</span>
</div>

<div class="block">
<h3>Parte Inicial</h3>
${dayData.inicial.map(t=>`<div class="task">${t}</div>`).join("")}
</div>

<div class="block">
<h3>Parte Central</h3>
${dayData.central.map(t=>`<div class="task">${t}</div>`).join("")}
</div>

<div class="block">
<h3>Parte Final</h3>
${dayData.final.map(t=>`<div class="task">${t}</div>`).join("")}
</div>

<div class="progress-container">
<div class="progress-label">
<span>Asistencia</span>
<span id="stat-${day}">0 / 18</span>
</div>
<div class="progress-bar"><div class="progress" id="prog-${day}"></div></div>
</div>

<div class="checklist" id="check-${day}"></div>

<button class="export-btn" onclick="exportToExcel('${day}')">Exportar a Excel</button>

</div>
</div>`;

container.innerHTML+=html;
generateChecklist(day);
});
}

function generateChecklist(day){
const container=document.getElementById("check-"+day);
playerList.forEach((name,i)=>{
let div=document.createElement("div");
div.className="player";
div.innerHTML=`<input type="checkbox" onchange="updateProgress('${day}')">
<label>${i+1}. ${name}</label>`;
container.appendChild(div);
});
}

function updateProgress(day){
const checks=document.querySelectorAll(`#check-${day} input`);
let checked=0;
checks.forEach(c=>{if(c.checked)checked++;});
document.getElementById("prog-"+day).style.width=(checked/checks.length)*100+"%";
document.getElementById("stat-"+day).innerText=`${checked} / ${checks.length}`;
}

function exportToExcel(day){
let csv="Jugador,Asistió\n";
document.querySelectorAll(`#check-${day} .player`).forEach(p=>{
let name=p.querySelector("label").innerText;
let checked=p.querySelector("input").checked?"Sí":"No";
csv+=`${name},${checked}\n`;
});
let blob=new Blob([csv],{type:"text/csv"});
let link=document.createElement("a");
link.href=URL.createObjectURL(blob);
link.download=`Semana${currentWeek}_${day}.csv`;
link.click();
}

function showDay(id,btn){
document.querySelectorAll('.day').forEach(d=>d.classList.remove('active'));
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.getElementById(id).classList.add('active');
btn.classList.add('active');
}

function changeWeek(week,btn){
currentWeek=week;
document.querySelectorAll('.week-selector button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
renderWeek();
}

renderWeek();
</script>

</body>
</html>
