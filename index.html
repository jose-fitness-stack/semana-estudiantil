<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Entrenamiento - CD Estudiantil</title>

<style>
:root{
--bg:#0f172a;
--card:#1e293b;
--card-soft:#273449;
--text:#f1f5f9;
--sub:#94a3b8;
--accent1:#22c55e;
--accent2:#3b82f6;
--accent3:#f59e0b;
--border:#334155;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui;}
body{background:var(--bg);color:var(--text);padding:30px;}

header{text-align:center;margin-bottom:30px;}
header h1{font-size:28px;margin-bottom:5px;}
header p{color:var(--sub);}

.week-selector{text-align:center;margin-bottom:20px;}
.week-selector button{
padding:8px 16px;
margin:5px;
border:none;
border-radius:8px;
cursor:pointer;
background:var(--card-soft);
color:var(--text);
}
.week-selector button.active{
background:var(--accent1);
color:#000;
font-weight:bold;
}

.tabs{display:flex;gap:10px;margin-bottom:25px;flex-wrap:wrap;}
.tab{
padding:10px 18px;
border-radius:8px;
border:none;
cursor:pointer;
background:var(--card-soft);
color:var(--text);
}
.tab.active{background:var(--accent2);}

.day{display:none;}
.day.active{display:block;}

.day-card{
background:var(--card);
padding:25px;
border-radius:16px;
margin-bottom:25px;
border:1px solid var(--border);
}

.day-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
flex-wrap:wrap;
}

.block{
margin-bottom:20px;
padding:15px;
background:var(--card-soft);
border-radius:12px;
}

.block h3{
margin-bottom:10px;
color:var(--accent2);
}

.task{
padding:6px 0;
border-bottom:1px solid var(--border);
font-size:14px;
display:flex;
align-items:center;
flex-wrap:wrap;
gap:6px;
}

.task input[type="number"]{
width:60px;
}

.task input[type="text"]{
flex:1;
min-width:180px;
}

.add-btn{
margin-top:10px;
padding:5px 10px;
border:none;
border-radius:6px;
background:var(--accent2);
color:white;
cursor:pointer;
}

.checklist{
margin-top:20px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:10px;
}

.player{
background:var(--card-soft);
padding:10px;
border-radius:8px;
font-size:13px;
display:flex;
align-items:center;
gap:10px;
}

.progress-container{margin:20px 0;}
.progress-label{
display:flex;
justify-content:space-between;
font-size:14px;
margin-bottom:5px;
}

.progress-bar{
height:12px;
background:var(--card-soft);
border-radius:20px;
overflow:hidden;
}

.progress{
height:100%;
background:var(--accent1);
width:0%;
transition:.4s;
}

.export-btn{
margin-top:15px;
padding:8px 14px;
border:none;
border-radius:8px;
background:var(--accent3);
cursor:pointer;
font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>⚽ CD Estudiantil</h1>
<p>Sub 14 (2012) · DT: Jose Antonio Mazo</p>
</header>

<div class="week-selector">
<button class="active" onclick="changeWeek(3,this)">Semana 3</button>
<button onclick="changeWeek(4,this)">Semana 4</button>
</div>

<div class="tabs">
<button class="tab active" onclick="showDay('lunes',this)">Lunes</button>
<button class="tab" onclick="showDay('martes',this)">Martes</button>
<button class="tab" onclick="showDay('jueves',this)">Jueves</button>
</div>

<div id="content"></div>

<script>

let currentWeek = 3;

const playerList = [
"Juan José Gálvez Rodríguez","Luis Angel Quintero Torres","Nicolás Cadena Molina",
"Tomás Ruiz Osorio","Juan José Ortiz","Nicolas Tamayo Olano",
"Roger Andrés","Jeronimo Blandón Bedoya","Juan Pablo Jaramillo Jaramillo",
"Miguel Ángel Ruiz Villegas","Isaac Manuel Ramírez Bolaño",
"Luis Said Andrade Hinestroza","Juan Miguel Ospina Villa",
"Alexis Posada Zabala","Dylan Esteban Tovar Montenegro",
"Emanuel Aristizabal","Matías Díaz David","Kevin Vanegas Cano"
];

const plans = {

3:{
lunes:{
inicial:[
{time:10,name:"Movilidad articular + desplazamiento"},
{time:10,name:"Secuencia pases + tercer hombre"},
{time:10,name:"Rondo 4v1 / 5v2"}
],
central:[
{time:20,name:"Posesión 6v6+8"},
{time:20,name:"Juego condicionado 10v10 (3 carriles)"}
],
final:[
{time:20,name:"Trabajo aeróbico intermitente"}
]
},
martes:{
inicial:[
{time:10,name:"Activación cognitiva"},
{time:10,name:"Preventivos"}
],
central:[
{time:20,name:"Circuito fuerza"},
{time:15,name:"Rechazos orientados"},
{time:15,name:"Conservación con comodines"}
],
final:[
{time:20,name:"Pases con finalización"}
]
},
jueves:{
inicial:[
{time:10,name:"Movilidad + desplazamiento"},
{time:10,name:"Aceleraciones"},
{time:10,name:"Técnica de carrera"}
],
central:[
{time:20,name:"Duelos 1v1 - 2v2"},
{time:40,name:"Fútbol alta intensidad"}
],
final:[
{time:10,name:"Estiramientos"}
]
}
},

4:{
lunes:{inicial:[],central:[],final:[]},
martes:{inicial:[],central:[],final:[]},
jueves:{inicial:[],central:[],final:[]}
}

};

function renderWeek(){
const container=document.getElementById("content");
container.innerHTML="";

["lunes","martes","jueves"].forEach(day=>{
let data=plans[currentWeek][day];

let html=`
<div class="day ${day==='lunes'?'active':''}" id="${day}">
<div class="day-card">
<div class="day-header">
<h2>${day.toUpperCase()}</h2>
<span>Semana ${currentWeek}</span>
</div>

${renderBlock(day,"inicial","Parte Inicial",data.inicial)}
${renderBlock(day,"central","Parte Central",data.central)}
${renderBlock(day,"final","Parte Final",data.final)}

<div class="progress-container">
<div class="progress-label">
<span>Asistencia</span>
<span id="stat-${day}">0 / 18</span>
</div>
<div class="progress-bar"><div class="progress" id="prog-${day}"></div></div>
</div>

<div class="checklist" id="check-${day}"></div>
<button class="export-btn" onclick="exportToExcel('${day}')">Exportar a Excel</button>

</div></div>`;

container.innerHTML+=html;
generateChecklist(day);
});
}

function renderBlock(day,type,title,data){
return `
<div class="block">
<h3>${title}</h3>
${data.map((task,i)=>`
<div class="task">
<input type="number" value="${task.time}" onchange="plans[currentWeek]['${day}']['${type}'][${i}].time=this.value"> min
<input type="text" value="${task.name}" onchange="plans[currentWeek]['${day}']['${type}'][${i}].name=this.value">
</div>
`).join("")}
<button class="add-btn" onclick="addTask('${day}','${type}')">+ Agregar actividad</button>
</div>`;
}

function addTask(day,type){
plans[currentWeek][day][type].push({time:10,name:"Nueva actividad"});
renderWeek();
}

function generateChecklist(day){
const container=document.getElementById("check-"+day);
playerList.forEach((name,i)=>{
let div=document.createElement("div");
div.className="player";
div.innerHTML=`<input type="checkbox" onchange="updateProgress('${day}')">
<label>${i+1}. ${name}</label>`;
container.appendChild(div);
});
}

function updateProgress(day){
const checks=document.querySelectorAll(`#check-${day} input`);
let checked=0;
checks.forEach(c=>{if(c.checked)checked++;});
document.getElementById("prog-"+day).style.width=(checked/checks.length)*100+"%";
document.getElementById("stat-"+day).innerText=`${checked} / ${checks.length}`;
}

function exportToExcel(day){
let csv="Jugador,Asistió\n";
document.querySelectorAll(`#check-${day} .player`).forEach(p=>{
let name=p.querySelector("label").innerText;
let checked=p.querySelector("input").checked?"Sí":"No";
csv+=`${name},${checked}\n`;
});
let blob=new Blob([csv],{type:"text/csv"});
let link=document.createElement("a");
link.href=URL.createObjectURL(blob);
link.download=`Semana${currentWeek}_${day}.csv`;
link.click();
}

function showDay(id,btn){
document.querySelectorAll('.day').forEach(d=>d.classList.remove('active'));
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.getElementById(id).classList.add('active');
btn.classList.add('active');
}

function changeWeek(week,btn){
currentWeek=week;
document.querySelectorAll('.week-selector button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
renderWeek();
}

renderWeek();

</script>

</body>
</html>
